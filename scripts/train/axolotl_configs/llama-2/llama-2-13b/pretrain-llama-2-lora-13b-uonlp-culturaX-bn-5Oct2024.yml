base_model: meta-llama/Llama-2-13b-hf
model_type: LlamaForCausalLM

# tokenizer
tokenizer_type: AutoTokenizer
tokenizer_path: /path/to/your/custom/tokenizer

tokenizer_config:
  tokenizer_type: AutoTokenizer
  trust_remote_code: true
  tokenizer_use_fast: true

load_in_8bit: false
load_in_4bit: false
strict: false

# datasets:
#   #- path: mhenrichsen/alpaca_2k_test
#   - path: yahma/alpaca-cleaned 
#     type: alpaca
max_steps: 10000
pretraining_dataset:
  - path: "uonlp/CulturaX"
    name: bn
    type: pretrain
dataset_prepared_path: /workspace/datasets/last_run_prepared_pretrain_llama2_13b_uonlp_CulturaX_bn_4Oct2024_1_15PM
val_set_size: 0.00
output_dir: /workspace/outputs/llama-2-13b-pretrain-uonlp-culturax-4Oct2024_1_15PM

# push to hf hub
hub_model_id: BanglaLLM/BanglaLLama-2-13b-unolp-culturax-base-v0.0.2
hub_strategy: end
#hub_private_repo: true

sequence_len: 4096
sample_packing: true
eval_sample_packing: false
pad_to_sequence_len: true
remove_unused_columns: true

adapter: lora
lora_model_dir:
lora_r: 32
lora_alpha: 16
lora_dropout: 0.05
lora_target_linear: true
lora_fan_in_fan_out:
lora_modules_to_save:
  - embed_tokens
  - lm_head

wandb_project: banglallm-training
wandb_entity: banglallm
wandb_watch:
wandb_name: balglallm-training-llama2-13b-pretraining-4Oct2024_1_15PM
wandb_run_id: balglallm-training-llama2-13b-pretraining-4Oct2024_1_15PM-id-1
wandb_log_model: checkpoint

gradient_accumulation_steps: 8
micro_batch_size: 1
num_epochs: 1
optimizer: adamw_bnb_8bit
lr_scheduler: cosine
learning_rate: 0.0002

train_on_inputs: false
group_by_length: false
bf16: auto
fp16:
tf32: false

gradient_checkpointing: true
early_stopping_patience:
resume_from_checkpoint:
local_rank:
logging_steps: 1
xformers_attention:
flash_attention: true
s2_attention:

warmup_steps: 10
evals_per_epoch: 4
eval_table_size:
eval_max_new_tokens: 128
saves_per_epoch: 1
debug:
deepspeed:
weight_decay: 0.0
fsdp:
fsdp_config:
special_tokens:
   pad_token: <|end_of_text|>
