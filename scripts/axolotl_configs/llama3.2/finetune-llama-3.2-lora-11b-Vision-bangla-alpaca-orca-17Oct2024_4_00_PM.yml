base_model: BanglaLLM/BanglaLLama-3-11b-unolp-culturax-base-v0.0.2
#model_type: LlamaForCausalLM
processor_type: AutoProcessor
#tokenizer_type: AutoTokenizer

# these 3 lines are needed for now to handle vision chat templates w images
skip_prepare_dataset: true
remove_unused_columns: false
sample_packing: false

load_in_8bit: false
load_in_4bit: false
strict: false

# datasets:
#   #- path: mhenrichsen/alpaca_2k_test
#   - path: yahma/alpaca-cleaned 
#     type: alpaca
max_steps: 10000
chat_template: alpaca #llama3_2_vision
datasets:
  - path: BanglaLLM/bangla-alpaca-orca 
    type: chat_template
    field_messages: text
dataset_prepared_path: /workspace/datasets/last_run_prepared_pretrain_llama3.2-11b-Vision_uonlp_CulturaX_bn_17Oct2024_4_00_PM
val_set_size: 0.00
output_dir: /workspace/outputs/llama-3.2-11b-pretrain-uonlp-culturax-17Oct2024_4_00_PM

# push to hf hub
#hub_model_id: BanglaLLM/BanglaLLama-3.2-11b-NoVision-TextOnly-unolp-culturax-base-v0.0.1
#hub_strategy: end

#sequence_len: 4096
sequence_len: 8192
pad_to_sequence_len: false

# all below changed above
#sample_packing: true 
#eval_sample_packing: false
#pad_to_sequence_len: true
#remove_unused_columns: true

adapter: lora
lora_model_dir:
lora_r: 32
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules: 'language_model.model.layers.[\d]+.(mlp|cross_attn|self_attn).(up|down|gate|q|k|v|o)_proj'
#lora_target_linear: true
lora_fan_in_fan_out:
lora_modules_to_save:
  - embed_tokens
  - lm_head

# wandb_project: banglallm-training
# wandb_entity: banglallm
# wandb_watch:
# wandb_name: balglallm-training-llama3.2-11b-Vision-pretraining-17Oct2024_4_00_PM
# wandb_run_id: balglallm-training-llama3.2-11b-Vision-pretraining-17Oct2024_4_00_PM-id-1
# wandb_log_model: checkpoint

gradient_accumulation_steps: 4 #8
micro_batch_size: 1
num_epochs: 1
optimizer: adamw_bnb_8bit
lr_scheduler: cosine
learning_rate: 0.0002

train_on_inputs: false
group_by_length: false
bf16: auto
fp16:
tf32: false

gradient_checkpointing: true
early_stopping_patience:
resume_from_checkpoint:
local_rank:
logging_steps: 1
xformers_attention:
flash_attention: false
s2_attention:

#warmup_steps: 10
warmup_ratio: 0.1
evals_per_epoch: 4
eval_table_size:
#eval_max_new_tokens: 128
saves_per_epoch: 4
debug:
deepspeed:
weight_decay: 0.0
fsdp:
fsdp_config:
special_tokens:
   pad_token: <|end_of_text|>
