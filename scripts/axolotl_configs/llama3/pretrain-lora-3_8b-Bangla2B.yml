base_model: meta-llama/Meta-Llama-3-8B
model_type: LlamaForCausalLM
tokenizer_type: AutoTokenizer

load_in_8bit: false
load_in_4bit: false
strict: false

# datasets:
#   #- path: mhenrichsen/alpaca_2k_test
#   - path: yahma/alpaca-cleaned 
#     type: alpaca
max_steps: 10000
pretraining_dataset:
  - path: /workspace/data/Bangla2B+/shards/parquet_files/
    ds_type: parquet
    type: pretrain
dataset_prepared_path:
val_set_size: 0.00
output_dir: /workspace/outputs/llama-3-8b-pretrain-Bangla2B

sequence_len: 4096
sample_packing: true
eval_sample_packing: false
pad_to_sequence_len: true
remove_unused_columns: true

adapter: lora
lora_model_dir:
lora_r: 32
lora_alpha: 16
lora_dropout: 0.05
lora_target_linear: true
lora_fan_in_fan_out:
lora_modules_to_save:
  - embed_tokens
  - lm_head

wandb_project:
wandb_entity:
wandb_watch:
wandb_name:
wandb_log_model:

gradient_accumulation_steps: 8
micro_batch_size: 1
num_epochs: 1
optimizer: adamw_bnb_8bit
lr_scheduler: cosine
learning_rate: 0.0002

train_on_inputs: false
group_by_length: false
bf16: auto
fp16:
tf32: false

gradient_checkpointing: true
early_stopping_patience:
resume_from_checkpoint:
local_rank:
logging_steps: 1
xformers_attention:
flash_attention: true
s2_attention:

warmup_steps: 10
evals_per_epoch: 4
eval_table_size:
eval_max_new_tokens: 128
saves_per_epoch: 1
debug:
deepspeed: deepspeed_configs/zero3.json
weight_decay: 0.0
# fsdp:
#   - full_shard
#   - auto_wrap
fsdp_config:
  fsdp_offload_params: true
  fsdp_state_dict_type: FULL_STATE_DICT
  fsdp_transformer_layer_cls_to_wrap: LlamaDecoderLayer
special_tokens:
   pad_token: <|end_of_text|>
